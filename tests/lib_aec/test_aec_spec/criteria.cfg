[DEFAULT]
near_end_max_suppression = -5
far_end_min_suppression = -20
suppression_band_min = 0
suppression_band_max = 8000
# Impulse response tests: max normalised misalignment of h_hat against the true echo path (dB).
# A filter precision floor at misalignment M adds residual echo independent of the adaptive
# error, costing 10log10(1 + 10^((ERLE + M)/10)) dB of ERLE: 0.13 dB at -40 dB and a real-world
# ERLE of 25 dB.
ir_max_misalignment = -40

[*,*,noise,*]
suppression_band_min = 0
suppression_band_max = 7500

[*,*,continuous,*]
near_end_max_suppression = -6

# Example entry:
#[simple,short,noise,2]
#near_end_max_suppression = -2


